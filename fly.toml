app = "ticketbox"
primary_region = "sin"

[build]

[env]
  SQL_INIT_MODE = "always"
  JPA_DDL_AUTO = "update"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
