spring.datasource.url=jdbc:h2:file:./.local/ticketbox;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
payments.mock.enabled=${MOCK_PAYMENTS_ENABLED:true}
jwt.secret=${JWT_SECRET:local-development-only-key-change-before-deployment-12345}

# Local HTTP only. Hosted deployments use Secure cookies.
auth.refresh.secure-cookie=false
