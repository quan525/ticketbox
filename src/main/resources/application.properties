spring.application.name=ticketbox
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketbox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Opt-in SQL seed (src/main/resources/data.sql). Default never. Set SQL_INIT_MODE=always to load demo catalog and users.
spring.sql.init.mode=${SQL_INIT_MODE:never}

spring.jackson.property-naming-strategy=SNAKE_CASE

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
auth.google.client-id=${GOOGLE_CLIENT_ID:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:warn}
