spring.application.name=ticketbox
# User-managed private file; AI must not read or create its contents.
spring.config.import=optional:file:./secrets/sepay.properties
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketbox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Opt-in SQL seed (src/main/resources/data.sql). Default never. Set SQL_INIT_MODE=always to load demo catalog and users.
spring.sql.init.mode=${SQL_INIT_MODE:never}

spring.jackson.property-naming-strategy=SNAKE_CASE

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
auth.google.client-id=${GOOGLE_CLIENT_ID:}
payments.mock.enabled=${MOCK_PAYMENTS_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:warn}

# SePay QR bank transfer + authenticated webhook. Disabled until fully configured.
payments.sepay.enabled=${SEPAY_ENABLED:false}
payments.sepay.mode=${SEPAY_MODE:TEST}
payments.sepay.auth=${SEPAY_AUTH:HMAC}
payments.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
payments.sepay.bank=${SEPAY_BANK:}
payments.sepay.gateway=${SEPAY_GATEWAY:}
payments.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
payments.sepay.account-name=${SEPAY_ACCOUNT_NAME:}
payments.sepay.sub-account=${SEPAY_SUB_ACCOUNT:}

# Redis-backed browser refresh sessions.
spring.data.redis.url=${TICKETBOX_REDIS_URL:redis://127.0.0.1:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
auth.refresh.ttl=${REFRESH_TOKEN_TTL:14d}
auth.refresh.secure-cookie=${REFRESH_COOKIE_SECURE:true}
